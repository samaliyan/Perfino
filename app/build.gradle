plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.perfume.price'
    compileSdk 34

    defaultConfig {
        applicationId 'ir.perfume.price'
        minSdk 24
        targetSdk 34
        // هر ساخت جدید در گیت‌هاب شماره‌ی بالاتری می‌گیرد تا نصب روی نسخه‌ی قبلی (آپدیت) پذیرفته شود
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ? (System.getenv('GITHUB_RUN_NUMBER') as int) + 100 : 100)
        versionName '1.37'
    }

    // امضای ثابت: همیشه با همین کلید امضا می‌شود، پس آپدیت «conflict» نمی‌دهد.
    // اگر ساختِ گیت‌هاب کلیدِ سری را بدهد (SIGN_KEYSTORE و ...)، با آن امضا می‌شود؛ وگرنه کلیدِ قدیمیِ داخلِ مخزن (تا وقتی کلیدِ تازه جا بیفتد)
    def signKs = System.getenv('SIGN_KEYSTORE')
    signingConfigs {
        shop {
            if (signKs) {
                storeFile file(signKs)
                storePassword System.getenv('SIGN_STORE_PASS')
                keyAlias (System.getenv('SIGN_KEY_ALIAS') ?: 'perfume')
                keyPassword (System.getenv('SIGN_KEY_PASS') ?: System.getenv('SIGN_STORE_PASS'))
            } else {
                storeFile file('perfume.keystore')
                storePassword 'perfume123'
                keyAlias 'perfume'
                keyPassword 'perfume123'
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.shop
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shop
        }
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// عمداً هیچ کتابخانه‌ی اضافه‌ای نیست؛ برنامه سبک می‌ماند.
