<!doctype html>
<html lang="fa" dir="rtl" data-th="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>قیمت عطر</title>
<style>
:root{--bg:#0c0f1f;--tx:#f2f4fb;--mu:rgba(242,244,251,.62);--gl:rgba(255,255,255,.1);--gb:rgba(255,255,255,.22);--card:rgba(255,255,255,.07);--cb:rgba(255,255,255,.12);--sheet:#171b30;--ac:#7fb2ff;--hb:rgba(12,15,31,.6);--pill:rgba(255,255,255,.14)}
:root[data-th="light"]{--bg:#eef1fb;--tx:#1a2238;--mu:#667089;--gl:rgba(255,255,255,.72);--gb:rgba(255,255,255,.95);--card:rgba(255,255,255,.78);--cb:rgba(255,255,255,.95);--sheet:#fff;--hb:rgba(238,241,251,.65);--pill:rgba(255,255,255,.8)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:Vazirmatn,'Noto Sans Arabic','Noto Naskh Arabic',system-ui,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font-family:inherit;color:inherit}
svg{display:block}
#app{position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;background:var(--bg)}
#stage,.mod{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden}
.mod{isolation:isolate;color:var(--tx);transition:background-color .7s ease}
.fl{animation:bob 4.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(1.4deg)}}
.pop{animation:pop .6s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{0%{transform:scale(.7) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(61,220,151,.6)}100%{box-shadow:0 0 0 9px rgba(61,220,151,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dr{to{transform:translate(30px,-40px) scale(1.15)}}

/* نوار بالا */
#upd{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:40;max-width:calc(100% - 120px);display:flex;align-items:center;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--pill);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--tx);transition:background-color .3s,color .3s}
#upd>*+*{margin-inline-start:8px}
#upd span{overflow:hidden;text-overflow:ellipsis}
#upd i{flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:#3ddc97;animation:pl 2.2s infinite}
#upd.busy i{background:transparent;border:2px solid var(--mu);border-top-color:var(--ac);animation:spin .9s linear infinite;width:12px;height:12px;flex-basis:12px}
#upd.stale{background:#d93a3a;color:#fff}
#upd.stale i{background:#fff;animation:none}
#gear{position:absolute;top:8px;right:12px;z-index:41;width:40px;height:40px;border-radius:50%;border:1px solid var(--gb);background:var(--pill);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;transition:transform .2s}
#gear:active{transform:scale(.9)}
#ov{position:absolute;top:0;left:0;right:0;bottom:0;z-index:35;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;background:var(--bg);font-size:16px;line-height:2}
#ov.on{display:flex}
#ov b{display:block;font-size:20px}
#ov button{margin-top:14px;padding:10px 24px;border-radius:22px;border:0;background:var(--ac);color:#0c0f1f;font-size:16px;font-weight:700}
#ov .sp{width:34px;height:34px;border-radius:50%;border:3px solid var(--cb);border-top-color:var(--ac);margin:0 auto 14px;animation:spin 1s linear infinite}

/* تایل عکس */
.tile{display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff;border-radius:14px}
.tile img{width:100%;height:100%;object-fit:contain;padding:3px;display:block}
.tile.fb{background:rgba(255,255,255,.12)}
:root[data-th="light"] .tile.fb{background:rgba(255,255,255,.7)}

/* ---- مدل الف ---- */
.ma{display:flex;flex-direction:column;padding-top:56px}
.ma .wh{position:relative;flex:1 1 auto;min-height:150px;touch-action:none;cursor:grab;-webkit-mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent)}
.ma .sel{position:absolute;left:46px;right:12px;top:50%;height:52px;margin-top:-26px;border-radius:26px;background:var(--gl);border:1px solid var(--gb)}
.ma .wr{position:absolute;right:0;top:50%;margin-top:-26px;height:52px;display:none;align-items:center;padding-right:26px;font-weight:700;font-size:22px;white-space:nowrap;transform-origin:right center;will-change:transform,opacity;max-width:calc((100% - 46px) / 1.12)}
.ma .wt{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ma .ab{position:absolute;left:6px;top:8px;bottom:8px;width:30px;z-index:5}
.ma .pn{flex:0 0 auto;margin:0 12px 12px;border-radius:28px;background:var(--gl);border:1px solid var(--gb);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);display:flex;align-items:center;padding:16px;z-index:6;position:relative}
.ma .pn>*+*{margin-inline-start:12px}
.ma .tx{flex:1 1 0;min-width:0}
.ma .nm{font-size:26px;font-weight:800;line-height:1.3;overflow-wrap:anywhere}
.ma .tg{display:inline-block;margin-top:4px;font-size:12px;padding:2px 10px;border-radius:12px;background:var(--cb)}
.ma .ln{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;border-top:1px solid var(--cb);padding-top:6px;min-width:0}
.ma .ln>*+*{margin-inline-start:8px}
.ma .ln span{font-size:13px;opacity:.75;white-space:nowrap}
.ma .ln b{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:26px}
.ma .ph{flex:0 0 96px;height:124px;flex:0 0 clamp(84px,27vw,112px);height:clamp(108px,34vw,140px);filter:drop-shadow(0 12px 16px rgba(0,0,0,.25))}
.ma .ph .tile{width:100%;height:100%;border-radius:20px}

/* ---- ستون حروف ---- */
.fs2{position:absolute;left:4px;width:30px;z-index:12;display:flex;flex-direction:column;justify-content:space-between;touch-action:none;cursor:pointer}
.fs2 span{display:block;text-align:center;font-size:12px;font-weight:700;line-height:1;pointer-events:none;color:var(--ac);transition:transform .14s ease-out}
.fs2 span.on{text-decoration:underline}
.bub2{position:absolute;left:52px;width:62px;height:62px;border-radius:50%;background:var(--ac);color:#0c0f1f;font-size:34px;font-weight:800;display:flex;align-items:center;justify-content:center;z-index:13;opacity:0;transform:scale(.6);transition:opacity .15s,transform .25s cubic-bezier(.2,1.4,.4,1);pointer-events:none}
.bub2.on{opacity:1;transform:scale(1)}

/* ---- سربرگ لیست‌ها ---- */
.hdr{position:absolute;top:0;left:0;right:0;height:108px;z-index:10;padding:54px 22px 0;display:flex;align-items:flex-end;justify-content:space-between;background:var(--hb);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border-bottom:1px solid var(--cb)}
.hdr .t1{font-size:22px;font-weight:800}
.hdr .t2{font-size:12px;color:var(--mu);margin-bottom:12px}
.hdr .cl{font-size:50px;font-weight:800;line-height:1;margin-bottom:4px;color:var(--ac);transition:color .5s}
.scl{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scl::-webkit-scrollbar{display:none}
.blob{position:absolute;border-radius:50%;filter:blur(46px);opacity:.55;animation:dr 14s ease-in-out infinite alternate;pointer-events:none}
:root[data-th="light"] .blob{opacity:.7}
.b1{width:240px;height:240px;background:#ff9fc4;top:-30px;right:-60px}
.b2{width:250px;height:250px;background:#8db8ff;top:330px;left:-90px;animation-delay:-5s}
.b3{width:220px;height:220px;background:#7fe8c0;bottom:-60px;right:-40px;animation-delay:-9s}
:root[data-th="dark"] .b1{background:#5b4bd6}:root[data-th="dark"] .b2{background:#0f8a74}:root[data-th="dark"] .b3{background:#c0407f}

/* ---- ردیف‌ها (مشترک) ---- */
.rw>*+*{margin-inline-start:10px}
.rw{display:flex;align-items:center;padding:8px 10px;border-radius:22px;background:var(--card);border:1px solid var(--cb)}
.rw .tile{flex:0 0 44px;height:58px}
.rw .tile{flex:0 0 clamp(38px,12vw,48px);height:clamp(50px,15.5vw,62px)}
.rw .m{flex:1 1 0;min-width:0}
.rw .n{font-size:15px;font-size:clamp(13px,4.2vw,16px);font-weight:700;line-height:1.35;overflow:hidden;overflow-wrap:anywhere}
.rw .tg{font-size:11px;color:var(--mu);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw .pr{flex:0 1 auto;max-width:46%;text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
.rw .p1{font-size:17px;font-size:clamp(14px,4.8vw,19px);font-weight:800;line-height:1.25}
.rw .p1 small{display:block;font-size:11px;color:var(--mu);font-weight:400;line-height:1.3}
.rw .p2{font-size:11px;color:var(--mu);margin-top:1px;line-height:1.3}
.rw .p1 i{font-style:normal;display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--mu);opacity:.55;margin-inline-start:5px;vertical-align:middle}

/* ---- مدل ج ---- */
.mc .scl{padding:0 12px 0 42px}
.mc .ghw{position:absolute;left:0;right:0;height:40px;display:flex;align-items:center}
.mc .gh{display:inline-block;padding:0 16px;border-radius:14px;background:var(--gl);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-size:20px;font-weight:800;color:var(--ac);line-height:1.5}
.mc .rw.v{position:absolute;left:0;right:0;opacity:0;transform:translateY(16px) scale(.97);transition:opacity .5s cubic-bezier(.2,.8,.2,1),transform .5s cubic-bezier(.2,.8,.2,1);box-shadow:0 6px 18px -10px rgba(30,40,110,.4)}
.mc .rw.in{opacity:1;transform:none}
.mc .n{max-height:calc(var(--h) - 34px)}
.mc .fs2{top:122px;bottom:24px}
.mc{--ac:#5b4bd6}
:root[data-th="dark"] .mc{--ac:#a89bff}

/* ---- مدل ز و ح ---- */
.mg .scl{padding:112px 12px 420px 44px}
.mg .n{max-height:calc(var(--rh) - 34px)}
.mg .rw{position:absolute;left:0;right:0;height:var(--rh);will-change:transform,opacity;transition:background-color .25s,border-color .25s,box-shadow .25s,color .25s}
.mg .fs2{top:116px;bottom:24px}
.mz .rw.on{background:var(--gl);border-color:var(--ac);box-shadow:0 0 26px -6px var(--ac)}
.mz .tile.fb{background:rgba(255,255,255,.12)}
.mh .ov{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;background:var(--hov)}
.mh .scl{perspective:800px;padding-top:120px}
.mh .rw{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.42);border-radius:26px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.25)}
.mh .rw .tg,.mh .rw .p1 small,.mh .rw .p2{color:rgba(255,255,255,.82)}
.mh .rw.on{background:rgba(255,255,255,.96);color:#1a2238;text-shadow:none;box-shadow:0 18px 30px -14px rgba(0,0,0,.5)}
.mh .rw.on .tg,.mh .rw.on .p1 small,.mh .rw.on .p2{color:#667089}
.mh .hdr{background:transparent;border-bottom:0;color:#fff}
.mh .hdr .t2,.mh .hdr .cl{color:rgba(255,255,255,.9)}
.mh .fs2 span{color:#fff}
.mh .bub2{background:#fff;color:#1a2238}
:root[data-th="light"] .mh .rw{background:rgba(255,255,255,.55);border-color:rgba(255,255,255,.9);color:#1a2238;text-shadow:none}
:root[data-th="light"] .mh .rw .tg,:root[data-th="light"] .mh .rw .p1 small,:root[data-th="light"] .mh .rw .p2{color:#586081}
:root[data-th="light"] .mh .hdr,:root[data-th="light"] .mh .hdr .t2,:root[data-th="light"] .mh .hdr .cl,:root[data-th="light"] .mh .fs2 span{color:#1a2238}
:root[data-th="light"] .mh .rw.on{box-shadow:0 18px 30px -14px rgba(30,40,110,.45)}

/* ---- تنظیمات ---- */
#scm{position:absolute;top:0;left:0;right:0;bottom:0;z-index:50;background:rgba(8,10,24,.55);opacity:0;pointer-events:none}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;z-index:51;border-radius:28px 28px 0 0;background:var(--sheet);color:var(--tx);transform:translate3d(0,110%,0);box-shadow:0 -20px 50px rgba(0,0,0,.3);padding:0 20px 22px;touch-action:pan-y}
#sheet .gr{width:44px;height:5px;border-radius:3px;background:var(--cb);margin:10px auto 6px;position:sticky;top:0}
#sheet h2{font-size:20px;margin:6px 0 14px}
#sheet h3{font-size:14px;margin:18px 0 8px;color:var(--mu);font-weight:600}
.seg{display:flex;flex-wrap:wrap;margin:0 -4px}
.seg button{margin:4px;flex:1 1 auto;min-width:0;padding:11px 8px;border-radius:16px;border:1.5px solid var(--cb);background:transparent;font-size:15px;font-weight:600;cursor:pointer;transition:transform .15s}
.seg button:active{transform:scale(.96)}
.seg button.on{border-color:var(--ac);background:var(--cb)}
.seg.mods button{flex:1 1 calc(50% - 8px);display:flex;flex-direction:column;align-items:center;line-height:1.4}
.seg.mods small{margin-top:2px;font-size:11px;color:var(--mu);font-weight:400}
.btn{width:100%;padding:13px;border-radius:18px;border:0;background:var(--ac);color:#0c0f1f;font-size:16px;font-weight:800;cursor:pointer}
.btn{position:relative;overflow:hidden}
.btn>span{position:relative;z-index:1}
.btn.busy{background:var(--cb);color:var(--tx)}
.btn .bar{position:absolute;top:0;bottom:0;right:0;background:var(--ac);opacity:.55;transition:width .4s ease;z-index:0}
.btn .bar.ind{animation:ind 1.3s ease-in-out infinite alternate}
@keyframes ind{from{transform:translateX(0)}to{transform:translateX(-150%)}}
#toast{position:absolute;left:16px;right:16px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:70;margin:0 auto;max-width:420px;padding:12px 16px;border-radius:16px;background:var(--tx);color:var(--bg);font-size:14px;font-weight:600;line-height:1.7;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;transform:translateY(20px);pointer-events:none;transition:opacity .25s,transform .25s}
#toast.on{opacity:1;transform:none}
#ov small{display:block;font-size:12px;color:var(--mu);margin-top:6px;line-height:1.8}
.btn.ghost{background:var(--cb);color:var(--tx);font-weight:600;font-size:14px;margin-top:8px;padding:10px}
.srcs{font-size:13px;line-height:1.9}
.srcs div>*+*{margin-inline-start:10px}
.srcs div{display:flex;justify-content:space-between;border-bottom:1px solid var(--cb);padding:3px 0}
.srcs span:last-child{color:var(--mu);text-align:left;min-width:0;overflow-wrap:anywhere}
.srcs .bad span:last-child{color:#ef5b5b}
.ver{margin-top:14px;font-size:11px;color:var(--mu);text-align:center}

/* ---- برند ← مدل ← جزئیات ---- */
#stage{transition:opacity .14s ease}
#stage.out{opacity:0}
#bk{position:absolute;top:8px;left:12px;z-index:42;width:40px;height:40px;padding:0;border-radius:20px;border:1px solid var(--gb);background:var(--pill);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:none;align-items:center;justify-content:center;font-size:14px;font-weight:700;cursor:pointer;color:var(--tx)}
#bk.on{display:flex}
.hdr>div:first-child{min-width:0;flex:1 1 auto;padding-inline-end:10px}
.hdr .t1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .cl{flex:0 0 auto}
.chev{opacity:.55;display:block;margin-inline-start:2px}
.rw .pr:has(.chev){display:flex;align-items:center;flex:0 0 auto}
.ma .bn{font-size:13px;font-weight:700;color:var(--ac);margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ma .hn{display:flex;align-items:center;justify-content:space-between;margin-top:10px;border-top:1px solid var(--cb);padding-top:8px;font-size:13px;opacity:.8;line-height:1.7}
.ma .pn{cursor:pointer}
.rw{cursor:pointer}
/* قفل ورود */
#ov .gt{width:100%;max-width:380px;margin:0 auto}
#ov .gt>span{display:block;font-size:14px;color:var(--mu);line-height:1.9;margin-top:4px}
#ov .pb{height:10px;border-radius:5px;background:var(--cb);margin:18px 0 12px;overflow:hidden}
#ov .pb i{display:block;height:100%;border-radius:5px;background:var(--ac);transition:width .4s ease}
#ov .st{font-size:14px;line-height:2;text-align:right}
#ov .st>div{display:flex;justify-content:space-between;border-bottom:1px solid var(--cb);padding:3px 0}
#ov .st>div>*+*{margin-inline-start:10px}
#ov .st>div.ok span:first-child:before{content:"✓ ";color:#3ddc97;font-weight:800}
#ov .gh2{display:block;margin:12px auto 0;background:var(--cb);color:var(--tx);font-weight:600;font-size:14px}
/* صفحه‌ی جزئیات */
#dt{position:absolute;top:0;left:0;right:0;bottom:0;z-index:45;background:var(--bg);transform:translate3d(0,102%,0);transition:transform .34s cubic-bezier(.2,.8,.2,1);visibility:hidden;display:flex;flex-direction:column;padding-top:54px}
#dt.on{transform:none;visibility:visible}
#dtx{position:absolute;top:8px;left:12px;z-index:3;height:40px;min-width:40px;padding:0 16px;border-radius:20px;border:1px solid var(--gb);background:var(--pill);font-size:14px;font-weight:700;cursor:pointer;color:var(--tx)}
#dtc{flex:1 1 auto;overflow-y:auto;padding:6px 16px 28px;-webkit-overflow-scrolling:touch}
.dtop{display:flex;align-items:center;margin-bottom:16px}
.dtop>*+*{margin-inline-start:14px}
.dpic{position:relative;flex:0 0 clamp(104px,32vw,132px);height:clamp(132px,40vw,166px);border-radius:20px;overflow:hidden;cursor:zoom-in;box-shadow:0 10px 24px -12px rgba(0,0,0,.45)}
.dpic .tile{width:100%;height:100%;border-radius:20px}
.dpic em{position:absolute;left:0;right:0;bottom:0;font-style:normal;font-size:11px;text-align:center;padding:3px 0;background:rgba(0,0,0,.5);color:#fff}
.dti{flex:1 1 0;min-width:0}
.dbn{font-size:14px;font-weight:700;color:var(--mu);margin-bottom:4px}
.dnm{font-size:26px;font-weight:800;line-height:1.35;overflow-wrap:anywhere}
.vr{margin-top:12px;border-radius:20px;background:var(--card);border:1px solid var(--cb);padding:6px 14px 8px;border-inline-start:6px solid var(--mu)}
.vr.g-m{border-inline-start-color:#4c8dff}.vr.g-w{border-inline-start-color:#ff5c9d}.vr.g-u{border-inline-start-color:#a07dff}
.vh{font-size:18px;font-weight:800;padding:6px 0 4px;line-height:1.5}
.sz{display:flex;align-items:baseline;justify-content:space-between;padding:8px 0;border-top:1px solid var(--cb);min-width:0}
.sz>*+*{margin-inline-start:10px}
.zm{font-size:16px;white-space:nowrap}
.zp{white-space:nowrap;font-variant-numeric:tabular-nums;min-width:0}
.zp b{font-size:22px;font-weight:800}
.zp small{font-size:12px;color:var(--mu);margin-inline-start:5px}
.zp i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mu);opacity:.55;margin-inline-start:6px}
.dnote{margin-top:14px;font-size:12px;color:var(--mu);text-align:center}
/* عکس بزرگ */
#vw{position:absolute;top:0;left:0;right:0;bottom:0;z-index:60;background:rgba(6,8,18,.94);display:none;align-items:center;justify-content:center;padding:18px;cursor:zoom-out}
#vw.on{display:flex}
#vwb{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#vwb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:14px;background:#fff;transition:filter .3s}
#vwb img:not(.big){filter:blur(1.2px)}
#vwb .vfb{width:min(70vw,320px)}
#vw .vh2{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:13px;color:rgba(255,255,255,.7);pointer-events:none}
@media (prefers-reduced-motion:reduce){.fl,.pop,.blob,#upd i{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div id="stage"></div>
  <div id="ov"></div>
  <div id="upd"><i></i><span id="updt"></span></div>
  <button id="gear" aria-label="تنظیمات"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3.4h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1c.5.4 1.1.7 1.7 1l.4 2.6h4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.4 1 2-3.4z"/></svg></button>
  <button id="bk" aria-label="بازگشت"><svg width="13" height="20" viewBox="0 0 10 16" aria-hidden="true" style="transform:scaleX(-1)"><path d="M8 1L2 8l6 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div id="dt" role="dialog" aria-label="جزئیات"><button id="dtx">بستن</button><div id="dtc"></div></div>
  <div id="vw" role="dialog" aria-label="عکس بزرگ"><div id="vwb"></div><div class="vh2">برای بستن، روی صفحه بزنید</div></div>
  <div id="scm"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="sheet" role="dialog" aria-label="تنظیمات">
    <div class="gr"></div>
    <h2>تنظیمات</h2>
    <h3>رنگ صفحه</h3>
    <div class="seg" id="sTheme"><button data-v="light">روشن</button><button data-v="dark">تاریک</button><button data-v="auto">خودکار</button></div>
    <h3>شکل لیست</h3>
    <div class="seg mods" id="sModel">
      <button data-v="a">چرخ<small>چرخ نیم‌دایره</small></button>
      <button data-v="c">شیشه<small>لیست شیشه‌ای</small></button>
      <button data-v="z">کانون<small>لیست با کانون</small></button>
      <button data-v="h">استوانه<small>استوانه‌ی رنگی</small></button>
    </div>
    <h3>قیمت‌ها</h3>
    <button class="btn" id="sRef"><span>بروزرسانی قیمت‌ها همین حالا</span></button>
    <div class="srcs" id="sSrc" style="margin-top:12px"></div>
    <button class="btn ghost" id="sFull" style="display:none">دریافت کامل از اول</button>
    <button class="btn ghost" id="sCopy" style="display:none">کپی گزارش خطا برای ارسال به سازنده</button>
    <div class="ver" id="sVer"></div>
  </div>
</div>
