name: Build Perfino
on:
  push:
    branches: [main]     # فقط شاخه‌ی اصلی نسخه منتشر می‌کند (همان که صفحه‌ی گیت‌هاب و README نشان می‌دهد)؛ شاخه‌های دیگر برنامه‌ی نصب‌شده را عوض نمی‌کنند
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false                 # دو ساخت هم‌زمان ترتیبشان به‌هم نخورد
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Find project folder
        id: p
        run: |
          f=$(find . -name settings.gradle -not -path './.git/*' | head -n1)
          if [ -z "$f" ]; then echo "settings.gradle not found. Files in repo:"; find . -not -path './.git/*' | head -60; exit 1; fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
      - name: Signing key from repository secrets (optional)
        env:
          KS_B64: ${{ secrets.SIGN_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.SIGN_STORE_PASS }}
          KS_KEYPASS: ${{ secrets.SIGN_KEY_PASS }}
        run: |
          # اگر رازها گذاشته شده باشند، APK با کلیدِ سری امضا می‌شود؛ وگرنه با کلیدِ قدیمیِ مخزن (رفتار قبلی)
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGN_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "SIGN_STORE_PASS=$KS_PASS" >> "$GITHUB_ENV"
            [ -n "$KS_KEYPASS" ] && echo "SIGN_KEY_PASS=$KS_KEYPASS" >> "$GITHUB_ENV"
            echo "Signing with the key from repository secrets"
          else
            echo "No signing secrets: using the old key in the repository"
          fi
      - name: Build release APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle --no-daemon assembleRelease
      - name: Show signing certificate (which key signed the APK)
        run: |
          A=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)
          "${A}apksigner" verify --print-certs "${{ steps.p.outputs.dir }}/app/build/outputs/apk/release/app-release.apk" | grep -i "SHA-256" || echo "could not read the certificate (not important)"
      - name: Copy APK
        run: |
          cp "${{ steps.p.outputs.dir }}/app/build/outputs/apk/release/app-release.apk" "$RUNNER_TEMP/Perfino.apk"
          cp "$RUNNER_TEMP/Perfino.apk" "$RUNNER_TEMP/PerfumePrice.apk"      # نامِ قدیمی فقط برای برنامه‌های نصب‌شده‌ی تا ۱.۴۵
      - name: Build web bundle (update without install)
        run: |
          # شماره‌ی بسته باید همان versionCode ی باشد که build.gradle به APK می‌دهد (برنامه آن‌ها را با هم مقایسه می‌کند)
          grep -q "GITHUB_RUN_NUMBER') as int) + 100" "${{ steps.p.outputs.dir }}/app/build.gradle" || { echo "versionCode formula in build.gradle is not RUN_NUMBER + 100"; exit 1; }
          bash tools/make-ota.sh "${{ steps.p.outputs.dir }}/app/src/main/assets/www" "$RUNNER_TEMP/ota" "$((GITHUB_RUN_NUMBER + 100))"
      - name: Test update-without-install (Java unit tests on the built bundle)
        run: |
          mkdir -p "$RUNNER_TEMP/jt"
          J="${{ steps.p.outputs.dir }}/app/src/main/java/ir/perfume/price"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/jt" "$J/Ota.java" "$J/OtaGuard.java" "$J/Http.java" tests/java/ir/perfume/price/OtaTest.java tests/java/ir/perfume/price/GuardTest.java tests/java/ir/perfume/price/HttpTest.java
          java -Dstdout.encoding=UTF-8 -cp "$RUNNER_TEMP/jt" ir.perfume.price.OtaTest "${{ steps.p.outputs.dir }}/app/src/main/assets/www" "$RUNNER_TEMP/ota"
          java -Dstdout.encoding=UTF-8 -cp "$RUNNER_TEMP/jt" ir.perfume.price.GuardTest
          java -Dstdout.encoding=UTF-8 -cp "$RUNNER_TEMP/jt" ir.perfume.price.HttpTest
      - name: Core logic tests (Node; a failing test stops the release)
        run: bash tests/run_node.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Perfino
          path: |
            ${{ runner.temp }}/Perfino.apk
            ${{ runner.temp }}/ota/www.zip
            ${{ runner.temp }}/ota/ota.json
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$((GITHUB_RUN_NUMBER + 100))
          V=$(sed -n 's/.*"v":"\([0-9.]*\)".*/\1/p' "${{ steps.p.outputs.dir }}/app/src/main/assets/www/version.json")
          [ -n "$V" ] || { echo "version.json has no version"; exit 1; }
          TAG="v$V"
          # یادداشتِ نسخه = همان بخشِ CHANGELOG؛ خطِ آخر (code=) را برنامه برای فهمیدنِ «نسخه‌ی تازه هست؟» می‌خواند
          awk -v v="($V)" 'index($0,"## ")==1{if(f)exit; if(index($0,v))f=1} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "CHANGELOG.md has no section for $V"; exit 1; }
          printf '\n\ncode=%s\n' "$CODE" >> "$RUNNER_TEMP/notes.md"
          up() {      # فایل‌ها با سه بار تلاش؛ ota.json همیشه آخر (گوشی‌ای که آن را دید، بقیه را هم پیدا می‌کند)
            for i in 1 2 3; do gh release upload "$@" --clobber && return 0; sleep 5; done; return 1
          }
          # ۱) نسخه‌ی رسمی: «Perfino 1.46» با برچسبِ v1.46. برنامه‌های تازه (از ۱.۴۶) از «آخرین نسخه‌ی رسمی» بروز می‌شوند.
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > /dev/null 2>&1; then
            gh release delete-asset "$TAG" ota.json --yes || true
            up "$TAG" "$RUNNER_TEMP/Perfino.apk" "$RUNNER_TEMP/ota/www.zip" || { echo "upload failed"; exit 1; }
            git tag -f "$TAG" "$GITHUB_SHA" && git push -f origin "refs/tags/$TAG" || echo "could not move the tag (not important)"
            gh release edit "$TAG" --title "Perfino $V" --notes-file "$RUNNER_TEMP/notes.md" --prerelease=false --latest
          else
            gh release create "$TAG" "$RUNNER_TEMP/Perfino.apk" "$RUNNER_TEMP/ota/www.zip" --target "$GITHUB_SHA" --title "Perfino $V" --notes-file "$RUNNER_TEMP/notes.md" --latest
          fi
          up "$TAG" "$RUNNER_TEMP/ota/ota.json" || { echo "ota.json upload failed"; exit 1; }
          # ۲) کانالِ قدیمی (برچسبِ «latest»): فقط برای برنامه‌هایی که تا نسخه‌ی ۱.۴۵ نصب شده‌اند و از این آدرس بروز می‌شوند.
          #    «پیش‌انتشار» علامت می‌خورد تا در گیت‌هاب «آخرین نسخه» همان نسخه‌ی رسمی باشد. بعد از نصبِ APKِ ۱.۴۶ دیگر لازم نیست.
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest" > /dev/null 2>&1; then
            gh release delete-asset latest ota.json --yes || true
            up latest "$RUNNER_TEMP/PerfumePrice.apk" "$RUNNER_TEMP/ota/www.zip" || { echo "legacy upload failed"; exit 1; }
            printf 'برای برنامه‌هایی که تا نسخه‌ی ۱.۴۵ نصب شده‌اند. نسخه‌ی اصلی: %s\n\ncode=%s\n' "$TAG" "$CODE" > "$RUNNER_TEMP/legacy.md"
            gh release edit latest --title "کانالِ بروزرسانیِ نسخه‌های قدیمی (Perfino $V)" --notes-file "$RUNNER_TEMP/legacy.md" --prerelease
            git tag -f latest "$GITHUB_SHA" && git push -f origin refs/tags/latest || echo "could not move the tag (not important)"
            up latest "$RUNNER_TEMP/ota/ota.json" || { echo "legacy ota.json upload failed"; exit 1; }
          fi
