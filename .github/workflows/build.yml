name: Build APK
on:
  push:
    branches: [main, master, update-1.3]     # فقط شاخه‌های اصلی نسخه‌ی «latest» را عوض می‌کنند؛ شاخه‌ی آزمایشی برنامه‌ی نصب‌شده را خراب نکند
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false                 # دو ساخت هم‌زمان ترتیبشان به‌هم نخورد
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Find project folder
        id: p
        run: |
          f=$(find . -name settings.gradle -not -path './.git/*' | head -n1)
          if [ -z "$f" ]; then echo "settings.gradle not found. Files in repo:"; find . -not -path './.git/*' | head -60; exit 1; fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
      - name: Build release APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle --no-daemon assembleRelease
      - name: Copy APK
        run: cp "${{ steps.p.outputs.dir }}/app/build/outputs/apk/release/app-release.apk" "$RUNNER_TEMP/PerfumePrice.apk"
      - name: Build web bundle (update without install)
        run: |
          # شماره‌ی بسته باید همان versionCode ی باشد که build.gradle به APK می‌دهد (برنامه آن‌ها را با هم مقایسه می‌کند)
          grep -q "GITHUB_RUN_NUMBER') as int) + 100" "${{ steps.p.outputs.dir }}/app/build.gradle" || { echo "versionCode formula in build.gradle is not RUN_NUMBER + 100"; exit 1; }
          bash tools/make-ota.sh "${{ steps.p.outputs.dir }}/app/src/main/assets/www" "$RUNNER_TEMP/ota" "$((GITHUB_RUN_NUMBER + 100))"
      - name: Test update-without-install (Java unit tests on the built bundle)
        run: |
          mkdir -p "$RUNNER_TEMP/jt"
          J="${{ steps.p.outputs.dir }}/app/src/main/java/ir/perfume/price"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/jt" "$J/Ota.java" "$J/OtaGuard.java" tests/java/ir/perfume/price/OtaTest.java tests/java/ir/perfume/price/GuardTest.java
          java -Dstdout.encoding=UTF-8 -cp "$RUNNER_TEMP/jt" ir.perfume.price.OtaTest "${{ steps.p.outputs.dir }}/app/src/main/assets/www" "$RUNNER_TEMP/ota"
          java -Dstdout.encoding=UTF-8 -cp "$RUNNER_TEMP/jt" ir.perfume.price.GuardTest
      - uses: actions/upload-artifact@v4
        with:
          name: PerfumePrice-apk
          path: |
            ${{ runner.temp }}/PerfumePrice.apk
            ${{ runner.temp }}/ota/www.zip
            ${{ runner.temp }}/ota/ota.json
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$RUNNER_TEMP/PerfumePrice.apk" "$RUNNER_TEMP/ota/www.zip" --target "$GITHUB_SHA" --title "PerfumePrice (latest)" --notes "code=$((GITHUB_RUN_NUMBER + 100))"
          # ota.json آخر بارگذاری می‌شود: گوشی‌ای که آن را دید، www.zip را هم حتماً پیدا می‌کند
          up=0
          for i in 1 2 3; do
            if gh release upload latest "$RUNNER_TEMP/ota/ota.json" --clobber; then up=1; break; fi
            sleep 5
          done
          [ "$up" = 1 ] || { echo "ota.json upload failed"; exit 1; }
