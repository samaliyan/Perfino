name: Build APK
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Find project folder
        id: p
        run: |
          f=$(find . -name settings.gradle -not -path './.git/*' | head -n1)
          if [ -z "$f" ]; then echo "settings.gradle not found. Files in repo:"; find . -not -path './.git/*' | head -60; exit 1; fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
      - name: Build debug APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle --no-daemon assembleDebug
      - name: Copy APK
        run: cp "${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/PerfumePrice.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: PerfumePrice-apk
          path: ${{ runner.temp }}/PerfumePrice.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$RUNNER_TEMP/PerfumePrice.apk" --target "$GITHUB_SHA" --title "PerfumePrice (latest)" --notes "Latest build"
